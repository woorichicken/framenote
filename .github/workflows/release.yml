name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing(OIDC). 빠지면 인증이 통째로 안 된다

concurrency:
  # 배포는 겹치면 안 된다. 앞 실행을 취소하지 않고 줄을 세운다.
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg 준비
        timeout-minutes: 6
        run: |
          # apt-get update 가 미러에서 몇 분씩 멈춘다(실측 2026-08-19: 두 실행이 13분 행,
          # 한 실행이 5분 상한에 걸렸다). 러너 이미지에는 패키지 목록이 이미 있으므로
          # **update 없이 설치를 먼저 시도**하고, 그게 안 될 때만 update 를 돈다.
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "이미 있습니다: $(ffmpeg -version | head -1)"
          elif sudo apt-get install -y --no-install-recommends ffmpeg; then
            echo "update 없이 설치했습니다."
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted Publishing(OIDC) 은 **npm CLI 기능**이다. 러너 기본 npm 은 너무 낮아 OIDC 교환을
      # 하지 않고, 그러면 인증 없이 publish 를 시도해 401 이 아니라 **404 "Not found"** 를 받는다
      # — 이름이 틀린 것처럼 보이는 그 오류다(실측 2026-08-19: 0.1.1 이 이걸로 실패했다).
      - name: npm 최신화 (OIDC 지원 버전)
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile
      # 배포 전에 CI 와 같은 게이트를 다시 본다. 여기서 막히면 npm 에 안 올라간다.
      - run: pnpm release:check
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: 아직 없는 버전만 배포한다
        run: |
          set -e
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          # 패키지가 npm 에 아예 없으면 **OIDC 로는 첫 배포를 못 한다** — npm 이 패키지가 있어야
          # Trusted Publisher 등록을 허용한다. 여기서 빨간불을 내면 첫 배포 전까지 모든 푸시가
          # 빨개지고, 그러면 진짜 실패를 무시하게 된다. 무엇을 해야 하는지 적고 통과시킨다.
          if ! npm view "$name" version >/dev/null 2>&1; then
            echo "::notice::$name 이 npm 에 아직 없습니다. 첫 배포는 사람이 한 번 해야 합니다."
            echo "  1) npm login && npm publish --access public"
            echo "  2) npmjs.com → $name → Settings → Trusted publishing 에 이 저장소와 release.yml 등록"
            echo "  3) 그다음부터는 버전만 올려 머지하면 여기서 자동으로 올라갑니다."
            exit 0
          fi

          # 버전을 안 올린 머지(문서·CI 수정)가 실패하지 않게 한다.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version 은 이미 있습니다. 건너뜁니다."
            exit 0
          fi
          npm publish --access public
