name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # 프레임 눈금 영상은 프레임 정확도 TC 의 전제다. 생성기가 깨지면 그 TC 를 아무도 못 돌린다.
  ruler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/make-ruler-video.mjs --out /tmp/ruler.mp4 --frames 90 --width 480 --height 270
      - name: 눈금이 규격대로 나왔는지
        run: |
          set -e
          out=$(ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames,r_frame_rate,width,height -of csv=p=0 /tmp/ruler.mp4)
          echo "$out"
          [ "$out" = "480,270,30/1,90" ] || { echo "규격 불일치"; exit 1; }
