name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 왕복 테스트가 실제 영상을 만들고 규격을 읽는다. mock 을 쓰지 않는 게 이 테스트의 전부라
      # ffmpeg 는 **apt 로 받지 않는다.** `apt-get update` 가 미러에서 몇 분씩 멈추고,
      # 실측(2026-08-19) 로 6회 중 3회가 상한에 걸렸다. GitHub 릴리스의 정적 빌드는 러너와
      # 같은 망이라 훨씬 안정적이고 30초면 끝난다. 실패하면 apt 로 한 번 더 시도한다.
      - name: ffmpeg 준비
        timeout-minutes: 6
        run: |
          set -e
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "이미 있습니다: $(ffmpeg -version | head -1)"
          elif curl -fsSL --retry 3 --retry-delay 2 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo install -m755 /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
            echo "정적 빌드로 설치했습니다."
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      # 요구사항과 테스트의 짝이 끊기면 여기서 막는다. 이게 없어서 세 건이 헛것을 검사했다.
      - run: pnpm tc:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # 눈금 영상이 맞는지도 여기서 본다. 브라우저가 필요한 프레임 정확도 검사만 로컬 전용이다.
      - run: pnpm verify:ruler
      # 화면 조작 회귀. 사람이 한 번 눌러본 것은 다음 커밋에서 깨져도 아무도 모른다.
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
