name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 왕복 테스트가 실제 영상을 만들고 규격을 읽는다. mock 을 쓰지 않는 게 이 테스트의 전부라
      # ffmpeg 없이는 돌 수 없다. 없으면 조용히 건너뛰지 않고 실패한다(아래 테스트의 가드).
      #
      # **이미 있으면 설치하지 않는다.** 러너 이미지에 대체로 들어 있고, apt 는 종종 몇 분씩
      # 멈춘다(실측 2026-08-19: 두 실행이 이 한 줄에서 13분 넘게 걸렸다).
      - name: ffmpeg 준비
        timeout-minutes: 6
        run: |
          # apt-get update 가 미러에서 몇 분씩 멈춘다(실측 2026-08-19: 두 실행이 13분 행,
          # 한 실행이 5분 상한에 걸렸다). 러너 이미지에는 패키지 목록이 이미 있으므로
          # **update 없이 설치를 먼저 시도**하고, 그게 안 될 때만 update 를 돈다.
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "이미 있습니다: $(ffmpeg -version | head -1)"
          elif sudo apt-get install -y --no-install-recommends ffmpeg; then
            echo "update 없이 설치했습니다."
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # 눈금 영상이 맞는지도 여기서 본다. 브라우저가 필요한 프레임 정확도 검사만 로컬 전용이다.
      - run: pnpm verify:ruler
      # 화면 조작 회귀. 사람이 한 번 눌러본 것은 다음 커밋에서 깨져도 아무도 모른다.
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
